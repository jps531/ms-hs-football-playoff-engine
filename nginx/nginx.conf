events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No nginx version in the Server header or on error pages.
    server_tokens off;

    # Content-Security-Policy: what pages may load and run. Scripts only from
    # this site, Cloudflare's Turnstile widget, and the one inline script every
    # page has (the dark-theme check in <head>, allowed by its hash: change that
    # script and the hash must change too, which backend/tests/unit/
    # nginx_csp_test.py checks). connect-src names the Auth0 tenant /moderate
    # signs in with. Inline style attributes are allowed: the app sets team
    # colors and layout sizes with them, and a style can't run code. Fonts are
    # all served from here.
    # The Prefect UI and FastAPI's docs bring their own scripts and get none.
    map $request_uri $content_security_policy {
        "~^/prefect/"                   "";
        "~^/(?:docs|redoc)(?:[/?]|$)"   "";
        default "default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'sha256-r4QSmPWyCUBT2FKqLSTRMk2aso6oC+WJa4BgMqaWhaE='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://mshsfbanalytics.us.auth0.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    }

    # Compress text responses: API JSON (the bracket matchups payload is a
    # couple hundred KB raw), the app's JS and CSS, and HTML.
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      application/json application/javascript text/css image/svg+xml text/xml application/xml text/plain;

    upstream api {
        server api:8000;
    }

    # Public submissions (the feedback form, score corrections, logo/helmet
    # uploads): 10 a minute per visitor with a burst of 5, refused here before
    # they reach the API. The API adds its own per-visitor and per-day limits,
    # duplicate suppression and a circuit breaker.
    limit_req_zone $binary_remote_addr zone=submissions:10m rate=10r/m;

    # Everything else that reaches the API: 10 a second per visitor with a
    # burst of 60. A page load makes at most 6 API calls, and a school or
    # stadium network can put a crowd behind one address, so this is loose
    # for people and only bites a script hammering the API.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream prefect {
        server prefect-server:4200;
    }

    # Old query-string links (/?class=3&region=6&season=2025) map onto the
    # path routes (/standings/3a/6). The query string rides along as-is; the
    # app drops the class/region params from it with replaceState on load.
    map $arg_class $legacy_class_path {
        "~^(?<n>[1-7])$" "/standings/${n}a";
        default          "";
    }
    map $arg_region $legacy_region_path {
        "~^(?<r>[1-9][0-9]?)$" "/${r}";
        default                "";
    }

    # Link previews: which generated meta file a page gets, by its original
    # URL (the page is served as /index.html, so $uri won't do). index.html
    # pulls /share/meta/<page>[/<team>].html into its <head> with a
    # server-side include: region, class and bracket pages each have a file,
    # and a team link (?team=<slug>) on a region or bracket page gets the
    # team's, falling back to the page's; pages without one (and keys with no
    # file yet) keep the generic tags written in index.html.
    map $request_uri $share_page {
        "~^/standings/(?<sc>[1-7])a/(?<sr>[1-8])/?(?:\?.*)?$" "${sc}-${sr}";
        "~^/standings/(?<sc2>[1-7])a/?(?:\?.*)?$"             "${sc2}";
        "~^/brackets/(?<bc>[1-7])a/?(?:\?.*)?$"              "bracket-${bc}";
        "~^/feedback"                                          "none";  # the generic tags, not the front page's canonical
        default                                                "site";
    }
    # Page content: which generated body/<page>.html index.html includes in
    # <main>, so the page reads without JavaScript (the app replaces it on
    # load). Region, class and bracket pages and the front page have one. A link to an
    # older week or season, or to the other odds mode, gets none: the latest
    # snapshot would be the wrong one to show, even briefly.
    map $request_uri $share_body {
        "~[?&](?:week|season|date|odds)="                         "none";
        "~^/standings/(?<bc>[1-7])a/(?<br>[1-8])/?(?:\?.*)?$"     "${bc}-${br}";
        "~^/standings/(?<bcc>[1-7])a/?(?:\?.*)?$"                "${bcc}";
        "~^/brackets/(?<bkc>[1-7])a/?(?:\?.*)?$"                 "bracket-${bkc}";
        "~^/(?:\?.*)?$"                                          "site";
        default                                                  "none";
    }
    # The class picker (1A–7A) is in the page from the start, with the page's
    # class marked, so it doesn't pop in (and push everything down) when the
    # app loads, and every page links every class. Bracket pages link brackets.
    map $request_uri $page_class {
        "~^/(?:standings|brackets)/(?<pcl>[1-7])a(?:[/?]|$)" "$pcl";
        default                                              "";
    }
    map $request_uri $class_link_base {
        "~^/brackets/" "brackets";
        default        "standings";
    }
    # The main nav (Standings / Bracket) in the page from the start, as the
    # app sets it (app.js syncNav): both point at the page's class, and the
    # section you're in is marked current.
    map $request_uri $nav_section {
        "~^/brackets/"  "bracket";
        "~^/standings/" "standings";
        "~^/(?:\?|$)"   "home";  # the front page: Home, on the phone tab bar
        default         "";
    }
    # The front page has no class, so no class picker (it has its own grid of
    # links instead). A "hidden" attribute on the bar, since nginx's SSI can't
    # nest the picker's own if/endif inside another.
    map $request_uri $show_class_picker {
        "~^/(?:\?|$)" "no";
        default       "yes";
    }
    map $arg_team $share_team {
        "~^(?<st>[a-z0-9]+(?:-[a-z0-9]+)*)$" "/${st}";
        default                              "";
    }

    # Search engines: pages that aren't content (the API, its docs, the
    # moderation page, the feedback form, the front page's in-app copy) say so
    # in a header, which works for JSON as well as HTML.
    map $request_uri $x_robots_tag {
        "~^/(?:api/|docs|redoc|openapi\.json|moderate|feedback|share/)" "noindex";
        default                                                           "";
    }

    # ---------------------------------------------------------------------------
    # Requests for any other hostname (scanners hitting the bare IP, someone
    # else's domain pointed here): no answer at all. On 443 the handshake is
    # refused, so no certificate is needed and none is shown.
    # ---------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect, except Let's Encrypt HTTP-01 challenges
    #
    # Certbot renews in webroot mode: it writes a token under
    # /var/www/certbot/.well-known/acme-challenge/ on the host (mounted
    # read-only here) and Let's Encrypt fetches it over plain HTTP. Serving it
    # straight from this block, ahead of the redirect, lets renewal run while
    # nginx keeps port 80 — see docs/operations/VM_DEPLOYMENT.md.
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name mshsfootball.com www.mshsfootball.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        # One address for everything: https://mshsfootball.com (www included).
        location / {
            return 301 https://mshsfootball.com$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS — main server block
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name mshsfootball.com www.mshsfootball.com;

        ssl_certificate     /etc/letsencrypt/live/mshsfootball.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mshsfootball.com/privkey.pem;
        # Mozilla's "intermediate" profile: TLS 1.2 limited to forward-secret
        # AEAD suites (TLS 1.3 suites are always strong), no session tickets.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"                                  always;
        add_header X-Frame-Options         "DENY"                                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"    always;
        add_header Content-Security-Policy $content_security_policy                   always;
        add_header Cross-Origin-Opener-Policy "same-origin"                           always;
        add_header X-Robots-Tag $x_robots_tag                                         always;

        # www.mshsfootball.com redirects to the bare domain, so search engines
        # see one copy of each page.
        if ($host = www.mshsfootball.com) {
            return 301 https://mshsfootball.com$request_uri;
        }

        # Addresses that aren't a page get a real 404 (a page saying so, with
        # links back in), not the app shell with a 200.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }

        # Limit request body size — Cloudinary rejects larger files anyway,
        # but this stops them from reaching application memory.
        client_max_body_size 12m;

        # ---------------------------------------------------------------------------
        # Scenarios page — single static HTML file; its script calls the
        # public /api/v1 endpoints below from the same origin
        # ---------------------------------------------------------------------------
        location = / {
            root /usr/share/nginx/html;
            ssi on;
            if ($legacy_class_path) {
                return 301 $legacy_class_path$legacy_region_path$is_args$args;
            }
            try_files /index.html =404;
        }

        # Page routes: /standings/{class}, /standings/{class}/{region} and
        # /brackets/{class}, served by the app's index.html, which reads the
        # path itself. Its <head> gets the page's own share tags (see
        # $share_page above). Anything else under those paths is a 404.
        location ~ ^/(?:standings/[1-7]a(?:/[1-9])?|brackets/[1-7]a)/?$ {
            root /usr/share/nginx/html;
            ssi on;
            try_files /index.html =404;
        }

        # Plain prefixes (not ^~), so the page-route regex above still wins.
        location /standings/ {
            return 404;
        }

        location = /standings {
            return 301 /;
        }

        location /brackets/ {
            return 404;
        }

        location = /brackets {
            return 301 /;
        }

        # The feedback form, served by the app.
        location = /feedback {
            root /usr/share/nginx/html;
            ssi on;
            try_files /index.html =404;
        }

        # Moderators' review page (a static page that signs in with Auth0).
        location = /moderate {
            root /usr/share/nginx/html;
            try_files /moderate.html =404;
        }

        location = /about {
            root /usr/share/nginx/html;
            try_files /about.html =404;
        }

        # The About page's old address; the browser keeps any #section on the redirect.
        location = /methodology {
            return 301 /about$is_args$args;
        }

        # Caching: browsers may reuse the app's files for 10 minutes before
        # checking (a quick 304 when unchanged), so a deploy shows up within
        # that; the fonts never change, so they're kept a year. `expires`, not
        # add_header, which would drop the server's security headers here.
        location ^~ /static/ {
            root /usr/share/nginx/html;
            expires 10m;
        }

        location ^~ /static/fonts/ {
            root /usr/share/nginx/html;
            expires 1y;
        }

        # Share cards the pipeline draws each morning (a volume shared with the
        # Prefect worker). Their URLs carry ?v=<snapshot date>, so previews
        # refresh when the data does; a short max-age covers the rest.
        location ^~ /static/og/ {
            alias /usr/share/nginx/share/og/;
            expires 1h;  # not add_header, which would drop the server's security headers here
        }

        # The whole bracket as an image to share, drawn with the cards: the latest at a fixed
        # address per season, class, view and version, so the same short max-age.
        location ^~ /static/bracket/ {
            alias /usr/share/nginx/share/bracket/;
            expires 1h;
        }

        # The generated page content index.html includes in <main>; with none,
        # the include falls back to the page's "needs JavaScript" notice.
        location ^~ /share/body/ {
            internal;
            root /usr/share/nginx;
            try_files $uri =404;
        }

        # The front page's content, for the app to show at "/" after navigating
        # there within the site (the same file the include above uses).
        location = /share/front.html {
            root /usr/share/nginx;
            default_type text/html;
            expires 5m;
            try_files /share/body/site.html =404;
        }

        # For search engines: the sitemap the pipeline writes, and robots.txt.
        location = /sitemap.xml {
            root /usr/share/nginx/share;
            default_type application/xml;
            try_files /sitemap.xml =404;
        }

        location = /robots.txt {
            root /usr/share/nginx/html;
        }

        # The generated <head> tags index.html includes: the team's file, else
        # its page's. Internal: only reachable as a server-side include.
        location ^~ /share/meta/ {
            internal;
            root /usr/share/nginx;
            try_files $uri /share/meta/${share_page}.html =404;
        }

        # ---------------------------------------------------------------------------
        # Visit counts (static/js/analytics.js, docs/reference/ANALYTICS.md): the browser
        # sends PostHog's events here and nginx forwards them to PostHog's US
        # cloud, so the page connects only to this site. The host is a variable,
        # resolved per request through Docker's DNS, so nginx starts even when
        # PostHog can't be reached. The visitor's address is passed on as
        # X-Forwarded-For: PostHog's cookieless counting needs it (it would
        # otherwise see only this server). No cookies go either way.
        # For PostHog's EU cloud, change the host to eu.i.posthog.com.
        # ---------------------------------------------------------------------------
        location ^~ /relay/ {
            limit_req          zone=api burst=60 nodelay;
            limit_req_status   429;
            client_max_body_size 1m;

            resolver           127.0.0.11 valid=300s ipv6=off;
            set $posthog_host  us.i.posthog.com;
            rewrite            ^/relay/(.*)$ /$1 break;
            proxy_pass         https://$posthog_host;
            proxy_ssl_server_name on;
            proxy_ssl_name     $posthog_host;
            proxy_ssl_verify   on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header   Host            $posthog_host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Cookie          "";
            proxy_set_header   Authorization   "";
            proxy_hide_header  Set-Cookie;
        }

        # ---------------------------------------------------------------------------
        # Public submissions: rate-limited per visitor (see limit_req_zone above)
        # ---------------------------------------------------------------------------
        location ^~ /api/v1/submissions/ {
            limit_req        zone=submissions burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;

            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Too many submissions from this connection. Please wait a minute and try again."}';
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"detail":"Too many requests from this connection. Please slow down and try again shortly."}';
        }

        # ---------------------------------------------------------------------------
        # API — FastAPI handles its own JWT auth per-endpoint. Rate-limited per
        # visitor (see the api zone above). Only /api/ and FastAPI's docs reach
        # it; any other address is a 404 page.
        # ---------------------------------------------------------------------------
        location / {
            return 404;
        }

        location ~ ^/(?:docs|redoc|openapi\.json)(?:/|$) {
            limit_req        zone=api burst=60 nodelay;
            limit_req_status 429;
            error_page 429 = @api_rate_limited;

            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req        zone=api burst=60 nodelay;
            limit_req_status 429;
            error_page 429 = @api_rate_limited;

            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
        }

        # ---------------------------------------------------------------------------
        # Prefect API calls from the browser.
        # Vue app calls /prefect/api/... (because PREFECT_UI_SERVE_BASE=/prefect
        # rewrites the placeholder); nginx strips /prefect/ to reach Prefect's /api/.
        # More specific than /prefect/ so nginx matches this block first.
        # ---------------------------------------------------------------------------
        location /prefect/api/ {
            auth_request       /internal/auth/verify-moderator;
            error_page 401 403 = @auth_error;

            proxy_pass         http://prefect/api/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ---------------------------------------------------------------------------
        # Prefect UI — owner only, by Bearer token or session cookie (the
        # verify-moderator path keeps its old name).
        #
        # With PREFECT_UI_SERVE_BASE=/prefect, Prefect mounts static files at
        # /prefect/ internally.  We must NOT strip the /prefect/ prefix here so
        # that Prefect receives the full path and serves the correct files.
        # ---------------------------------------------------------------------------
        location /prefect/ {
            auth_request       /internal/auth/verify-moderator;
            error_page 401 403 = @auth_error;

            proxy_pass         http://prefect/prefect/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ---------------------------------------------------------------------------
        # Internal auth subrequest — only reachable by nginx (auth_request)
        # ---------------------------------------------------------------------------
        location = /internal/auth/verify-moderator {
            internal;
            proxy_pass              http://api/api/v1/auth/verify-moderator;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length  "";
            proxy_set_header        X-Original-URI  $request_uri;
            proxy_set_header        Authorization   $http_authorization;
            proxy_set_header        Cookie          $http_cookie;
        }

        # ---------------------------------------------------------------------------
        # Auth error handler for Prefect UI access denials
        # ---------------------------------------------------------------------------
        location @auth_error {
            default_type application/json;
            return 401 '{"detail":"Moderator authentication required"}';
        }
    }
}