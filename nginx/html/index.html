<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi High School Football Playoff Races</title>
  <meta name="description" content="Every Mississippi high school football region race: who's in, who's out, and exactly what has to happen next.">
  <link rel="icon" type="image/png" href="/static/mark.png">
  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("mshsf.theme"); } catch { /* storage unavailable */ }
      const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
    })();
  </script>
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=nippo@700&amp;display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="site-header-bar">
    <header class="site-header">
      <a class="site-header__home" href="/" aria-label="Mississippi High School Football, all regions">
        <img src="/static/mark.png" alt="" width="34" height="29">
        <span>Mississippi High School Football</span>
      </a>
      <form class="team-search" role="search">
        <label for="team-search" class="visually-hidden">Find a team</label>
        <input id="team-search" type="search" list="team-options" placeholder="Find a team" autocomplete="off" enterkeyhint="go">
        <datalist id="team-options"></datalist>
      </form>
      <label class="theme-select">
        <span class="visually-hidden">Theme</span>
        <select id="theme-select">
          <option value="system">System theme</option>
          <option value="light">Light theme</option>
          <option value="dark">Dark theme</option>
        </select>
      </label>
    </header>
  </div>

  <div class="scrubber-bar">
    <div class="scrubber-bar__inner" id="scrubber"></div>
  </div>

  <main id="app" tabindex="-1">
    <noscript><div class="page"><p class="notice">This page needs JavaScript to load the standings.</p></div></noscript>
  </main>

  <footer class="site-footer">
    <p><a href="/methodology">How the odds and scenarios are calculated</a></p>
    <p>Seeds aren’t official until the MHSAA announces them. Odds are estimates for fans, not for wagering.</p>
    <p>Scores from <a href="https://www.ahsfhs.org/">AHSFHS</a>. Updated daily at 9:15 AM Central. © 2025–2026 Paul Sullivan. All rights reserved.</p>
  </footer>

  <script src="/static/js/theme.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
