x-env-common: &env-common
  ENVIRONMENT: "${ENVIRONMENT:-local}"
  NETWORK: "${NETWORK:-mshsfootball-local}"
  PREFECT_API_URL: "${PREFECT_API_URL:-http://prefect-server:4200/api}"
  PREFECT_LOGGING_LEVEL: "${PREFECT_LOGGING_LEVEL:-INFO}"
  POSTGRES_HOST: "${POSTGRES_HOST:-db}"
  POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
  POSTGRES_DB: "${POSTGRES_DB:-mshsfootball}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  # No default: a compose file that falls back to "postgres" is a password anyone can read.
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}"
  PREFECT_PORT: "${PREFECT_PORT:-4200}"
  API_PORT: "${API_PORT:-8000}"
  NGINX_PORT: "${NGINX_PORT:-80}"
  PYTHONPATH: "${PYTHONPATH:-/opt/prefect/flows/pipelines}"
  CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
  CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
  CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
  CLOUDINARY_BASE_URL: "${CLOUDINARY_BASE_URL}"
  AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
  AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
  SESSION_SECRET_KEY: "${SESSION_SECRET_KEY}"

# Images are pinned by digest (here and in the Dockerfiles) so every deploy
# runs what was tested; Dependabot (.github/dependabot.yml) proposes updates.
# Every container gets no-new-privileges: nothing in it can gain privileges
# through setuid binaries.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *hardening
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: nginx_${ENVIRONMENT}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      # Share cards and meta tags the Prefect worker draws (see share_assets_pipeline.py)
      - share-assets:/usr/share/nginx/share:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot: renewal writes HTTP-01 challenge tokens here on the host
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - prefect-server
    networks:
      - mshsfootball
    restart: unless-stopped

  prefect-server:
    <<: *hardening
    # Same Prefect tag as Dockerfile.prefect's base image.
    image: prefecthq/prefect:2.17.1-python3.11@sha256:16f31cae6b600a5b6872503858ae512899b765be019620739eb0cdba316081f4
    container_name: prefect-server_${ENVIRONMENT}
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0 --port ${PREFECT_PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Only Prefect's own settings: the server never touches the app database,
    # Cloudinary or Auth0, so it doesn't hold their secrets.
    environment:
      PREFECT_LOGGING_LEVEL: "${PREFECT_LOGGING_LEVEL:-INFO}"
      PREFECT_UI_SERVE_BASE: "/prefect"
      PREFECT_UI_API_URL: "/prefect/api"
    networks:
      - mshsfootball
    volumes:
      - prefect-data:/root/.prefect

  prefect-worker:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.prefect
    container_name: prefect-worker_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      <<: *env-common
      # Share cards: read from the API, written where nginx serves them.
      SHARE_API_URL: "http://api:8000/api/v1"
      SHARE_OUTPUT_DIR: "/opt/share"
      # Daily moderation digest (submission_digest_pipeline.py); unset = log only.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_SECURITY: "${SMTP_SECURITY:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      DIGEST_TO: "${DIGEST_TO:-}"
      SITE_URL: "${SITE_URL:-https://mshsfootball.com}"
      # Least-privilege role from sql/app_roles.sql; falls back to the owner until it exists.
      POSTGRES_USER: "${PIPELINE_DB_USER:-${POSTGRES_USER:-postgres}}"
      POSTGRES_PASSWORD: "${PIPELINE_DB_PASSWORD:-${POSTGRES_PASSWORD}}"
    volumes:
      - share-assets:/opt/share
    networks:
      - mshsfootball
    depends_on:
      - prefect-server

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.api
    # Runs as an unprivileged user (Dockerfile.api) and needs no capabilities.
    cap_drop:
      - ALL
    container_name: api_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      <<: *env-common
      # Cloudflare Turnstile on the feedback form; unset = off.
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      # The Auth0 single-page app /moderate signs in with.
      AUTH0_SPA_CLIENT_ID: "${AUTH0_SPA_CLIENT_ID:-}"
      # CORS origin; required (not *) once ENVIRONMENT isn't local.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-*}"
      # Least-privilege role from sql/app_roles.sql; falls back to the owner until it exists.
      POSTGRES_USER: "${API_DB_USER:-${POSTGRES_USER:-postgres}}"
      POSTGRES_PASSWORD: "${API_DB_PASSWORD:-${POSTGRES_PASSWORD}}"
    networks:
      - mshsfootball
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Local PostgreSQL for testing (disabled on VM by using profiles)
  db:
    <<: *hardening
    # Stay on major 17: a new major needs a dump and restore, not just a pull.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    profiles: ["local-db"]
    environment:
      <<: *env-common
      # For sql/init_app_roles.sh on a fresh database.
      API_DB_PASSWORD: "${API_DB_PASSWORD:-}"
      PIPELINE_DB_PASSWORD: "${PIPELINE_DB_PASSWORD:-}"
    # Loopback only, for local tools: Docker's port rules bypass ufw, so a bare
    # "5432:5432" would leave the database open to the internet behind nothing
    # but the cloud firewall. Containers reach it over the compose network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/get_standings_for_region.sql:/docker-entrypoint-initdb.d/02_get_standings_for_region.sql:ro
      - ./sql/override_helpers.sql:/docker-entrypoint-initdb.d/03_override_helpers.sql:ro
      - ./sql/seeds/locations_championship_stadiums.sql:/docker-entrypoint-initdb.d/04_locations_championship_stadiums.sql:ro
      - ./sql/seeds/playoff_formats_2025.sql:/docker-entrypoint-initdb.d/05_playoff_formats_2025.sql:ro
      - ./sql/seeds/playoff_formats_2026.sql:/docker-entrypoint-initdb.d/06_playoff_formats_2026.sql:ro
      - ./sql/seeds/championship_venues_history.sql:/docker-entrypoint-initdb.d/07_championship_venues_history.sql:ro
      - ./sql/init_app_roles.sh:/docker-entrypoint-initdb.d/08_app_roles.sh:ro
      - ./sql/app_roles.sql:/docker-entrypoint-initdb.d/app_roles.sql.inc:ro
    networks:
      - mshsfootball
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  mshsfootball:
    name: mshsfootball_${ENVIRONMENT}
    driver: bridge

volumes:
  dbdata:
    driver: local
  prefect-data:
    driver: local
  share-assets:
    driver: local
