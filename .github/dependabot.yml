# Dependabot: weekly PRs for new versions, plus security updates as soon as an
# advisory is published (turn on "Dependabot security updates" in the repo's
# Settings -> Code security). Docker images are pinned by digest, so these
# PRs are the only way they change.
version: 2
updates:
  # Python packages: pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Base images in Dockerfile.api and Dockerfile.prefect
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Prefect 3 is a different product; Postgres majors need a dump and restore.
      - dependency-name: "prefecthq/prefect"
        update-types: ["version-update:semver-major"]
      # Python stays on 3.11 (patch releases only): a new minor needs the
      # locked packages to have wheels for it, and the worker to move too.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images in docker-compose.yml (nginx, postgres, prefect-server)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prefecthq/prefect"
        update-types: ["version-update:semver-major"]
