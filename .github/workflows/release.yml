# A GitHub release for each version of the site (backend/version.py), tagged vX.Y.Z, with its CHANGELOG.md
# entry as its notes (scripts/release.py).
#
# - After CI passes on a push to main that changed the version: that version, tagged at that commit. A PR
#   that bumps the version is released once it merges and its CI is green; one that doesn't bump it
#   releases nothing (so a later push never tags an older version on the wrong commit).
#
# Older versions without a release are scripts/backfill_releases.sh's, run once by hand: the Actions token
# can't create a tag on an old commit, whose workflow files differ from main's.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write  # to create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only CI that passed on a push to main in this repository: never a pull request's run (a fork's
    # branch can be called main too).
    if: >-
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2  # the pushed commit and its parent, to compare their versions
          persist-credentials: false
      - name: Release the version this push set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python3 scripts/release.py version)
          if [ "$(python3 scripts/release.py version-at "$SHA~1")" = "$version" ]; then
            echo "This push didn't change the version ($version); nothing to release"
            exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          python3 scripts/release.py notes "$version" > notes.md
          gh release create "v$version" --target "$SHA" --title "v$version" --notes-file notes.md --latest
