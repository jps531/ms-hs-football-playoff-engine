[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "ms-hs-football-playoff-engine"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = [
    # The caps on prefect, griffe, anyio and pydantic are deliberate, for
    # Prefect 2 (the flows are Prefect 2; Prefect 3 is a rewrite): pydantic
    # 2.10+ stops it importing ("'type' object is not iterable"). Dependabot
    # is lockfile-only, so it stays inside them; lift one deliberately, with
    # CI green.
    "prefect>=2.20.27,<3",  # 2.20.27 is the first to work with anyio 4.14 (it defines TaskGroup.create_task)
    "griffe<1.0",
    "anyio>=4.14.2,<5",  # 4.14 made TaskGroup.create_task abstract, which crashes Prefect before 2.20.27 (prefect_compat_test.py); 4.14.2 has the security fixes
    "pydantic>=2.0,<2.10",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=2.0",  # scenario explanations' margin grids (scenario_viewer.py); pandas already brings it
    "lxml>=5.2",
    "psycopg2-binary>=2.9",
    "psycopg[binary,pool]>=3.1",
    "playwright>=1.47",
    "beautifulsoup4>=4.12.0",
    "fastapi[standard]>=0.136.0",
    "cloudinary>=1.40",
    "pyjwt[crypto]>=2.10",
    "slowapi>=0.1.9",
    "coloraide>=3.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0",  # backend/scripts/add_playoff_season.py reads the season's bracket config
]

[dependency-groups]
dev = [
    "docstr-coverage>=2.3",
    "matplotlib>=3.10.8",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-branch --cov-report=term-missing"
filterwarnings = [
    "ignore::PendingDeprecationWarning:prefect._vendor.starlette.formparsers",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name — 'l' is a legitimate abbreviation for losses in sports stats
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "**/__init__.py",
    "backend/prefect/*",
    "backend/api/*",
    "backend/api/routers/*",
    "backend/api/models/*",
    "backend/helpers/database_helpers.py",
    "backend/helpers/web_helpers.py",
    "backend/tests/*",
]

[tool.coverage.report]
# Exclude Prefect pipeline files — these require a live DB/Prefect and are
# not unit-testable in isolation. Coverage numbers reflect pure logic only.
omit = [
    "**/__init__.py",
    "backend/prefect/*",
    "backend/api/*",
    "backend/api/routers/*",
    "backend/api/models/*",
    "backend/helpers/database_helpers.py",
    "backend/helpers/web_helpers.py",
    "backend/tests/*",
]
